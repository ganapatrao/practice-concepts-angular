<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-icon" aria-hidden="true">↗</div>
    <h1 id="login-title">Welcome back</h1>
    <p class="login-description">Sign in to continue to your account.</p>

    <form class="login-form">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        value="demo.user"
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        value="password123"
      />

      <label class="admin-option" for="admin-login">
        <input id="admin-login" name="adminLogin" type="checkbox" [(ngModel)]="isAdmin" />
        Log in as admin
      </label>

      <label class="admin-option" for="template-practice-login">
        <input
          id="template-practice-login"
          name="templatePractice"
          type="checkbox"
          [(ngModel)]="isTemplatePractice"
        />
        Template-driven form practice only
      </label>

      <button type="button" (click)="login()">Log in</button>
    </form>

    <p class="login-note">Mockup only — login is not connected yet.</p>
    <aside class="practice-note">
      <strong>Routing practice</strong>
      <p>Select template practice to store that role and open only its practice page. Otherwise,
        the admin checkbox selects the existing admin or employee dashboard.</p>
    </aside>
  </section>
</main>
